name: 功能建议
description: 描述希望解决的问题和使用场景
title: "[Feature] "
body:
  - type: textarea
    id: problem
    attributes:
      label: 想解决什么问题？
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 希望怎样改进？
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 已尝试的办法与补充说明
      description: 请勿填写账号、登录资料或私人数据库。
