[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "fundlab-local"
version = "0.3.0"
description = "QFund 本地基金数据工具：采集、保存、导出与溢价分析"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
authors = [{name = "Qqqjunlang"}]
keywords = ["fund", "qdii", "local", "windows", "finance"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Web Environment",
  "Operating System :: Microsoft :: Windows",
  "Programming Language :: Python :: 3",
  "Topic :: Office/Business :: Financial",
]
requires-python = ">=3.11"
dependencies = ["playwright==1.56.0", "openpyxl==3.1.5", "plotly==7.1.0"]

[project.scripts]
fundlab = "fundlab.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"fundlab.analysis" = ["*.js"]
"fundlab.web" = ["static/*.html", "static/*.css", "static/*.js", "static/*.svg"]
"fundlab.scheduling" = ["calendar-*.json", "*.ps1"]
